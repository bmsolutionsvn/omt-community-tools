[package]
name = "omt-desktop-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "OMT Desktop Capture — send monitors and windows as OMT-HX sources (egui/eframe)"

[[bin]]
name = "omt-desktop-capture"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
eframe.workspace = true
egui.workspace = true
omthx.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
suite-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-capture.workspace = true
wasapi.workspace = true
windows = { version = "0.62", features = ["Win32_System_Performance"] }